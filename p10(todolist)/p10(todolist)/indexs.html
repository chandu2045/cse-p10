<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #f4dfba;
      }
      h1 {
        text-align: center;
        color: #876445;
      }
      .c2 {
        display: flex;
        justify-content: center;
      }
      .tasks {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .ul {
        display: flex;
        width: 500px;
        justify-content: space-between;
        align-items: center;
        color: #ca965c;
        font-size: 25px;
      }
      .inp1 {
        height: 25px;
        width: 23px;
        margin-right: 10px;
      }
      .d1 {
        display: flex;
        align-items: center;
      }
      .i2 {
        border-width: 0px;
      }
      .add {
        border-width: 0px;
        margin-left: 10px;
        height: 30px;
        width: 90px;
        border-radius: 3px;
        background-color: aliceblue;
      }
      .b2 {
        border-width: 0px;
        background-color: aliceblue;
        width: 25px;
        height: 25px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>TO-DO List</h1>
      <div class="c2">
        <input type="text" id="i" class="i2" />
        <button id="b1" class="add">ADD</button>
      </div>
      <div id="tasks" class="tasks"></div>
    </div>
  </body>
  <script>
    const b1 = document.getElementById("b1");
    b1.addEventListener("click", () => {
      const i = document.getElementById("i");
      //   alert(i.value);
      const tasks = document.getElementById("tasks");
      const ul = document.createElement("ul");
      const li1 = document.createElement("li");
      const inp1 = document.createElement("input");
      const b2 = document.createElement("button");
      b2.classList.add("b2");
      inp1.type = "checkbox";
      inp1.classList.add("inp1");
      inp1.addEventListener("change", () => {
        if (inp1.checked) {
          li1.style.textDecoration = "line-through";
        } else {
          li1.style.textDecoration = "none";
        }
      });
      b2.addEventListener("click", () => {
        li1.remove();
        inp1.remove();
        b2.remove();
      });
      li1.textContent = i.value;
      b2.textContent = "X";
      ul.classList.add("ul");
      ul.appendChild(li1);
      const div = document.createElement("div");
      div.classList.add("d1");
      div.appendChild(inp1);
      div.appendChild(b2);
      ul.appendChild(div);
      tasks.appendChild(ul);
      i.value = "";
    });
  </script>
</html>
